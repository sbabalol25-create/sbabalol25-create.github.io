<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      text-align: center;
      width: min(420px, 90%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      margin: 0 0 22px;
      color: #444;
      font-size: 16px;
    }

    .btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d88;
      color: white;
    }

    #noBtn {
      background: #e9e9e9;
      color: #333;
      position: relative;
    }

    .hidden {
      display: none;
    }

    .big {
      font-size: 28px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p id="subtext">I promise snacks, good vibes, and zero stress.</p>

    <div class="btns" id="buttons">
      <button id="yesBtn">Yes 💘</button>
      <button id="noBtn">No 😭</button>
    </div>

    <div id="result" class="hidden">
      <div class="big">YAYYY!! 💞</div>
      <p>Best decision ever. I owe you a sweet treat 🍓</p>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const buttons = document.getElementById("buttons");
    const subtext = document.getElementById("subtext");

    const phrases = [
      "Are you sure? 🥺",
      "No takesies backsies…",
      "Think again 😭",
      "I’ll be so sad 😔",
      "Ok but I brought snacks…",
      "Last chance… 💔"
    ];

    let i = 0;

    yesBtn.addEventListener("click", () => {
      buttons.classList.add("hidden");
      subtext.textContent = "I knew it 😌";
      result.classList.remove("hidden");
    });

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 250 - 125;
      const y = Math.random() * 180 - 90;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
      subtext.textContent = phrases[i % phrases.length];
      i++;
    });

    // Mobile-friendly: tap makes it dodge too
    noBtn.addEventListener("click", () => {
      const x = Math.random() * 250 - 125;
      const y = Math.random() * 180 - 90;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
      subtext.textContent = phrases[i % phrases.length];
      i++;
    });
  </script>
</body>
</html>
